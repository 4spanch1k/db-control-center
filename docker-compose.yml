version: '3.8'

services:
  # ========================================
  # Core Database (Metadata & Analytics)
  # ========================================
  metadata-postgres:
    image: postgres:15-alpine
    container_name: db-control-center-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-control_center}
    ports:
      - "5432:5432"
    volumes:
      - metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - db_control_net

  # ========================================
  # Target Database (For backups testing)
  # ========================================
  target-postgres:
    image: postgres:15-alpine
    container_name: db-control-center-target
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: target_db
    ports:
      - "5433:5432"
    volumes:
      - target_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - db_control_net

  # ========================================
  # S3 Storage (MinIO)
  # ========================================
  minio:
    image: minio/minio:latest
    container_name: db-control-center-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - db_control_net

  # ========================================
  # Python Backend Microservice
  # ========================================
  python_backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: db-control-center-python
    ports:
      - "8000:8000"
    environment:
      # Database
      DB_HOST: ${DB_HOST:-metadata-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-control_center}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-backups}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      # Environment
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_APPLY_MIGRATIONS: ${AUTO_APPLY_MIGRATIONS:-true}
      MIGRATION_TIMEOUT_SEC: ${MIGRATION_TIMEOUT_SEC:-120}
    depends_on:
      metadata-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db_control_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # Next.js Web Application
  # ========================================
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: db-control-center-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: ${DB_HOST:-metadata-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-control_center}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      PYTHON_BACKEND_URL: ${PYTHON_BACKEND_URL:-http://python_backend:8000}
    depends_on:
      - metadata-postgres
      - python_backend
    restart: unless-stopped
    networks:
      - db_control_net

volumes:
  metadata_data:
  target_data:
  minio_data:


networks:
  db_control_net:
    driver: bridge
